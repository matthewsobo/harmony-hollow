# Deploys the site to GitHub Pages on every push to main.
#
# Builds the Vite app (type-check + bundle + PWA service worker) and uploads
# dist/. The Phase 0 mic test rides along via public/phase0-mic-test/.
#
# One-time setup: Pages must be enabled by hand once (repo Settings → Pages →
# Build and deployment → Source: "GitHub Actions"), because the workflow's
# built-in token isn't allowed to create the Pages site itself. After that,
# every push to main deploys automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test:pitch

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
