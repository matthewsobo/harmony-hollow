# Deploys the site to GitHub Pages on every push to main.
#
# Right now the "site" is just static files (the Phase 0 mic test), so we
# upload the repo as-is. When Phase 1 adds a Vite build, this workflow gains a
# "npm ci && npm run build" step and uploads the dist/ folder instead.
#
# One-time setup: Pages must be enabled by hand once (repo Settings → Pages →
# Build and deployment → Source: "GitHub Actions"), because the workflow's
# built-in token isn't allowed to create the Pages site itself. After that,
# every push to main deploys automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
